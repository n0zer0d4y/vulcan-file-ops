version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Supply-chain quarantine: only propose versions that have been public for
    # at least 14 days (most malicious npm releases are caught within that window).
    cooldown:
      default-days: 14
    open-pull-requests-limit: 5
    # Minor and patch updates arrive together in one PR. Major updates are
    # reviewed and applied by hand, one package at a time, because they can
    # break the build or the MCP protocol behavior.
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # Pinned on purpose: newer releases hang several test suites (see CHANGELOG 1.3.0).
      - dependency-name: "jest"
      - dependency-name: "@jest/globals"
      - dependency-name: "ts-jest"
      # pdfmake 0.3 changed its output API and breaks PDF generation. Unit tests
      # mock pdfmake, so CI cannot catch this; migrate by hand.
      - dependency-name: "pdfmake"
        update-types: ["version-update:semver-minor"]
      - dependency-name: "@types/pdfmake"
        update-types: ["version-update:semver-minor"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 14
